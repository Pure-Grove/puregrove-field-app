<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PureGrove">
<title>PureGrove Field App</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: #FCFCF7; color: #171714;
  font-size: 16px; min-height: 100vh;
}
.screen { display: none; }
.screen.active { display: block; }

/* Band */
.band { background: #1C3A13; padding: 20px 20px 16px; }
.band-inner { display: flex; justify-content: space-between; align-items: flex-start; }
.mark-name { font-size: 22px; font-weight: bold; color: #FCFCF7; letter-spacing: -0.01em; }
.mark-tag { font-size: 9px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: #D9BE89; margin-top: 4px; }
.band-label { font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #D9BE89; text-align: right; }

/* Home */
.body-pad { padding: 20px 16px; }
.sec-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8A8A84; margin-bottom: 12px; }
.tier-card {
  background: #FCFCF7; border: 2px solid #E4F0E4; border-radius: 12px;
  padding: 18px 16px; margin-bottom: 12px;
  display: block; width: 100%; text-align: left;
  cursor: pointer; -webkit-appearance: none;
}
.tier-card:active { background: #FAF8F2; border-color: #2D5A1E; }
.tier-num { font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #C9A96E; margin-bottom: 4px; }
.tier-name { font-size: 22px; font-weight: bold; color: #171714; letter-spacing: -0.02em; }
.tier-name em { font-style: italic; color: #2D5A1E; }
.tier-desc { font-size: 13px; color: #5A5A56; margin-top: 4px; }

/* Job header */
.job-header { padding: 14px 16px 12px; border-bottom: 1px solid #E4F0E4; }
.back-btn {
  background: none; border: none; color: #C9A96E;
  font-size: 12px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; cursor: pointer; padding: 0;
  margin-bottom: 10px; display: block; font-family: inherit;
}
.eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: #C9A96E; margin-bottom: 6px; }
.job-title { font-size: 28px; font-weight: bold; color: #171714; letter-spacing: -0.025em; line-height: 1.1; }
.job-title em { font-style: italic; color: #2D5A1E; }

/* Progress */
.progress-wrap { padding: 10px 16px 0; }
.progress-track { height: 4px; background: #E4F0E4; border-radius: 2px; }
.progress-bar { height: 100%; background: #1C3A13; border-radius: 2px; transition: width 0.3s; }
.progress-lbl { font-size: 11px; color: #8A8A84; margin-top: 5px; }

/* Steps */
.phase-pad { padding: 16px; }
.phase-badge {
  display: inline-block; font-size: 10px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  background: #E4F0E4; color: #1C3A13;
  padding: 5px 10px; border-radius: 6px; margin-bottom: 14px;
}
.step-card {
  background: #FAF8F2; border: 1px solid #E4F0E4;
  border-radius: 10px; padding: 13px 14px;
  margin-bottom: 10px; display: flex; gap: 11px;
}
.step-card.gold { border-left: 3px solid #C9A96E; }
.step-num { font-size: 10px; font-weight: 600; color: #8A8A84; min-width: 24px; padding-top: 2px; flex-shrink: 0; }
.step-body { flex: 1; }
.step-text { font-size: 14px; line-height: 1.6; color: #171714; }
.step-text b { font-weight: 600; }
.mix-pill {
  display: inline-block; background: #E4F0E4; border-radius: 6px;
  padding: 5px 10px; font-size: 12px; font-weight: 500; color: #1C3A13;
  margin-top: 6px; margin-right: 4px;
}
.warn-box {
  background: #FFF8EC; border: 1px solid rgba(201,169,110,0.4);
  border-radius: 8px; padding: 10px 12px; margin-top: 8px;
  font-size: 13px; color: #7A5C2E; line-height: 1.5;
}
.dwell-box {
  background: #FFF8EC; border: 1px solid rgba(201,169,110,0.4);
  border-radius: 8px; padding: 10px 12px; margin-top: 8px;
  font-size: 13px; color: #7A5C2E; line-height: 1.5; font-weight: 600;
}
.gold-badge {
  display: inline-block; background: #C9A96E; color: #3A2700;
  font-size: 9px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
  margin-left: 6px; vertical-align: middle;
}

/* Nav */
.nav-row {
  padding: 14px 16px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid #E4F0E4;
  display: flex; gap: 10px; background: #FCFCF7;
  position: fixed; bottom: 0; left: 0; right: 0;
}
.btn-main {
  flex: 1; background: #1C3A13; color: #FCFCF7;
  border: none; border-radius: 12px; padding: 16px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: inherit; -webkit-appearance: none;
}
.btn-main:active { background: #2D5A1E; }
.btn-back-sm {
  background: #FCFCF7; color: #5A5A56;
  border: 1.5px solid #E4F0E4; border-radius: 12px;
  padding: 16px 20px; font-size: 15px; cursor: pointer;
  font-family: inherit; -webkit-appearance: none;
}
.btn-back-sm:active { background: #FAF8F2; }

/* Checklist */
.cl-score { font-size: 12px; font-weight: 600; color: #1C3A13; margin-bottom: 14px; }
.cl-group { border: 1.5px solid #E4F0E4; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.cl-group-lbl {
  background: #1C3A13; color: #D9BE89;
  font-size: 10px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; padding: 8px 14px;
}
.cl-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 14px; background: #FCFCF7;
  border-top: 1px solid #E4F0E4;
  cursor: pointer; width: 100%; text-align: left;
  border-left: none; border-right: none; border-bottom: none;
  font-family: inherit; -webkit-appearance: none;
}
.cl-row:active { background: #FAF8F2; }
.cl-row.premium { border-left: 3px solid #C9A96E; }
.cl-box {
  width: 26px; height: 26px; flex-shrink: 0;
  border: 2px solid #C4D9C0; border-radius: 6px;
  background: #FCFCF7; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
}
.cl-box.on { background: #1C3A13; border-color: #1C3A13; color: #FCFCF7; font-size: 14px; }
.cl-text { font-size: 14px; color: #171714; line-height: 1.45; flex: 1; }
.cl-text.done { text-decoration: line-through; color: #8A8A84; }

/* Complete */
.complete-body { padding: 30px 16px 100px; text-align: center; }
.complete-icon {
  width: 64px; height: 64px; background: #E4F0E4; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px; font-size: 30px;
}
.complete-title { font-size: 30px; font-weight: bold; color: #171714; margin-bottom: 8px; }
.complete-title em { font-style: italic; color: #2D5A1E; }
.complete-sub { font-size: 14px; color: #5A5A56; line-height: 1.5; margin-bottom: 28px; }
.btn-full {
  display: block; width: 100%; background: #1C3A13; color: #FCFCF7;
  border: none; border-radius: 12px; padding: 16px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: inherit; -webkit-appearance: none;
}
.btn-full:active { background: #2D5A1E; }
</style>
</head>
<body>

<!-- ══════════ HOME ══════════ -->
<div id="s-home" class="screen active">
  <div class="band">
    <div class="band-inner">
      <div><div class="mark-name">PureGrove</div><div class="mark-tag">Clean Turf, Done Right</div></div>
      <div class="band-label">Field App</div>
    </div>
  </div>
  <div class="body-pad">
    <div class="sec-label">Select a tier to begin</div>
    <button class="tier-card" onclick="startJob('fresh')">
      <div class="tier-num">Tier One</div>
      <div class="tier-name">Fresh <em>Grove</em></div>
      <div class="tier-desc">Surface maintenance</div>
    </button>
    <button class="tier-card" onclick="startJob('revived')">
      <div class="tier-num">Tier Two</div>
      <div class="tier-name">Revived <em>Grove</em></div>
      <div class="tier-desc">Deep odor elimination</div>
    </button>
    <button class="tier-card" onclick="startJob('renewed')">
      <div class="tier-num">Tier Three</div>
      <div class="tier-name">Renewed <em>Grove</em></div>
      <div class="tier-desc">Restoration + premium protection</div>
    </button>
  </div>
</div>

<!-- ══════════ JOB ══════════ -->
<div id="s-job" class="screen">
  <div class="band">
    <div class="band-inner">
      <div><div class="mark-name">PureGrove</div><div class="mark-tag">Clean Turf, Done Right</div></div>
      <div class="band-label" id="job-phase-lbl">Pre-Job</div>
    </div>
  </div>
  <div class="job-header">
    <button class="back-btn" onclick="confirmBack()">‹ Back</button>
    <div class="eyebrow" id="job-eyebrow"></div>
    <div class="job-title" id="job-title"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="progress-lbl" id="prog-lbl"></div>
  </div>
  <div id="job-body" style="padding-bottom:90px;"></div>
  <div class="nav-row">
    <button class="btn-back-sm" id="btn-prev" onclick="prevPhase()" style="display:none;">‹</button>
    <button class="btn-main" id="btn-next" onclick="nextPhase()">Next ›</button>
  </div>
</div>

<!-- ══════════ COMPLETE ══════════ -->
<div id="s-complete" class="screen">
  <div class="band">
    <div class="band-inner">
      <div><div class="mark-name">PureGrove</div><div class="mark-tag">Clean Turf, Done Right</div></div>
      <div class="band-label">Done</div>
    </div>
  </div>
  <div class="complete-body">
    <div class="complete-icon">✓</div>
    <div class="complete-title">Job <em>complete.</em></div>
    <div class="complete-sub">All steps done. Load out and head to the next job.</div>
    <button class="btn-full" onclick="goHome()">Start New Job</button>
  </div>
</div>

        {n:'14.4', t:'<b>Remove all waste bags and debris from the property.</b>'},
        {n:'14.5', t:'<b>Close and lock the gate.</b> Take a photo of the locked gate before leaving.', warn:'Do not leave without confirming the gate is fully closed and locked. Gate photo required.'},
        {n:'14.6', t:'<b>Upload all photos (including gate photo) and ATP results</b> to the job record.'}
      ]}
    ],
    checklist:{
      'Pre-Job':[
        {t:'All products mixed at correct ratios',p:false},
        {t:'ATP baseline test complete — 1–2 zones',p:true},
        {t:'Before photos taken — angles noted for matching after shots',p:false}
      ],
      'Job':[
        {t:'Pet waste removed — set aside for removal',p:false},
        {t:'Full turf deep power broomed — debris in single pile',p:false},
        {t:'No debris toward pool / patio / neighbor',p:false},
        {t:'Debris pile + edges/cracks vacuumed',p:false},
        {t:'Backpack blower run — edges + perimeter',p:false},
        {t:'Perimeter weeds removed (add-on confirmed if applicable)',p:false},
        {t:'OxyTurf applied — full saturation, 10–15 min dwell observed',p:false},
        {t:'Deep agitation performed after dwell',p:false},
        {t:'Pressure washer rinse — full surface, consistent passes',p:true},
        {t:'Surface drained before next product applied',p:false},
        {t:'OxiTabs or Vital Oxide applied — air dry, no rinse',p:false},
        {t:'Infill inspected — fresh infill added where needed',p:false},
        {t:'303 UV Protectant — light, even, undiluted',p:true},
        {t:'NonScents odor barrier — light, even, undiluted',p:true},
        {t:'Final groom complete',p:false}
      ],
      'Post-Job':[
        {t:'ATP post-job test complete — same zones as baseline',p:true},
        {t:'After photos taken — matching angles, turf finished',p:false},
        {t:'All equipment emptied and cleaned',p:false},
        {t:'Waste bags + debris removed from property',p:false},
        {t:'Gate closed and locked — photo taken',p:false},
        {t:'All photos and ATP results uploaded to job record',p:false}
      ]
    }
  }
};

var cur=null, phase=0, cs={};

function show(id){
  var all=document.querySelectorAll('.screen');
  for(var i=0;i<all.length;i++) all[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goHome(){ cur=null; phase=0; cs={}; show('s-home'); }
function confirmBack(){ if(confirm('Leave this job?')) goHome(); }

function startJob(tier){
  cur=tier; phase=0; cs={};
  var t=T[tier];
  Object.keys(t.checklist).forEach(function(g){ t.checklist[g].forEach(function(_,i){ cs[g+'_'+i]=false; }); });
  document.getElementById('job-eyebrow').textContent=t.eyebrow;
  document.getElementById('job-title').innerHTML=t.title;
  renderPhase();
  show('s-job');
}

function renderPhase(){
  var t=T[cur], total=t.phases.length+1, pct=Math.round((phase/total)*100);
  var isCL=phase===t.phases.length;
  document.getElementById('prog-bar').style.width=pct+'%';
  var lbl=isCL?'Checklist':t.phases[phase].label;
  document.getElementById('job-phase-lbl').textContent=lbl;
  document.getElementById('prog-lbl').textContent='Step '+(phase+1)+' of '+total+' — '+lbl;
  document.getElementById('btn-prev').style.display=phase===0?'none':'block';
  document.getElementById('btn-next').textContent=isCL?'✓ Job Complete':'Next ›';
  if(isCL){ renderCL(); } else { renderSteps(t.phases[phase]); }
}

function renderSteps(p){
  var h='<div class="phase-pad"><div class="phase-badge">'+p.label+'</div>';
  p.steps.forEach(function(s){
    var cls='step-card'+(s.premium?' gold':'');
    h+='<div class="'+cls+'"><div class="step-num">'+s.n+'</div><div class="step-body">'+
      '<div class="step-text">'+s.t+(s.premium?'<span class="gold-badge">Renewed</span>':'')+'</div>';
    if(s.mixes){ s.mixes.forEach(function(m){ h+='<div class="mix-pill">⊕ '+m+'</div>'; }); }
    if(s.warn) h+='<div class="warn-box">⚠ '+s.warn+'</div>';
    if(s.dwell) h+='<div class="dwell-box">'+s.dwell+'</div>';
    h+='</div></div>';
  });
  h+='</div>';
  document.getElementById('job-body').innerHTML=h;
}

function renderCL(){
  var t=T[cur], total=0, chk=0;
  Object.keys(t.checklist).forEach(function(g){ t.checklist[g].forEach(function(_,i){ total++; if(cs[g+'_'+i]) chk++; }); });
  var h='<div class="phase-pad">'+
    '<div style="font-size:20px;font-weight:bold;color:#171714;margin-bottom:4px;">Field Checklist</div>'+
    '<div style="font-size:13px;color:#5A5A56;margin-bottom:10px;">Tap each item to check off.</div>'+
    '<div class="cl-score" id="cl-score">'+chk+' / '+total+' completed</div>';
  Object.keys(t.checklist).forEach(function(grp){
    h+='<div class="cl-group"><div class="cl-group-lbl">'+grp+'</div>';
    t.checklist[grp].forEach(function(item,i){
      var key=grp+'_'+i, on=cs[key];
      h+='<button class="cl-row'+(item.p?' premium':'')+'" onclick="toggleCL(\''+grp+'\','+i+')">'+
        '<div class="cl-box'+(on?' on':'')+'" id="clb_'+grp+'_'+i+'">'+(on?'✓':'')+'</div>'+
        '<span class="cl-text'+(on?' done':'')+'" id="clt_'+grp+'_'+i+'">'+item.t+(item.p?'<span class="gold-badge">Renewed</span>':'')+'</span>'+
        '</button>';
    });
    h+='</div>';
  });
  h+='</div>';
  document.getElementById('job-body').innerHTML=h;
}

function toggleCL(grp,i){
  var key=grp+'_'+i; cs[key]=!cs[key]; var on=cs[key];
  var b=document.getElementById('clb_'+grp+'_'+i);
  var t=document.getElementById('clt_'+grp+'_'+i);
  if(b){ b.className='cl-box'+(on?' on':''); b.textContent=on?'✓':''; }
  if(t){ t.className='cl-text'+(on?' done':''); }
  var tier=T[cur], total=0, chk=0;
  Object.keys(tier.checklist).forEach(function(g){ tier.checklist[g].forEach(function(_,idx){ total++; if(cs[g+'_'+idx]) chk++; }); });
  var sc=document.getElementById('cl-score'); if(sc) sc.textContent=chk+' / '+total+' completed';
}

function nextPhase(){ if(phase>=T[cur].phases.length){ show('s-complete'); return; } phase++; renderPhase(); window.scrollTo(0,0); }
function prevPhase(){ if(phase>0){ phase--; renderPhase(); window.scrollTo(0,0); } }
</script>
